name: Harden v3.5.0 Drive sync

on:
  push:
    branches: [v3.5.0-drive-files]
    paths: ['.github/workflows/v350-sync-fix.yml']

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.5.0-drive-files
          fetch-depth: 0
      - name: Preserve project links and polish copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/jarvis-drive/index.ts')
          s = p.read_text()
          old = """  const rows = remote.map((file) => normalizeRemoteFile(file, userId))
            for (let i = 0; i < rows.length; i += 500) {
              const chunk = rows.slice(i, i + 500)
              const { error } = await userClient.from('jarvis_files').upsert(chunk, { onConflict: 'user_id,provider,provider_file_id' })
              if (error) throw error
            }

            const seen = new Set(rows.map((row) => row.provider_file_id))
            const { data: existing, error: existingError } = await userClient.from('jarvis_files').select('id,provider_file_id').eq('user_id', userId).eq('provider', PROVIDER)
            if (existingError) throw existingError
            const staleIds = (existing || []).filter((row) => !seen.has(row.provider_file_id)).map((row) => row.id)
          """.replace('            ', '')
          new = """  const { data: existing, error: existingError } = await userClient.from('jarvis_files')
              .select('id,provider_file_id,project_id')
              .eq('user_id', userId)
              .eq('provider', PROVIDER)
            if (existingError) throw existingError
            const projectByProviderId = new Map((existing || []).map((row) => [row.provider_file_id, row.project_id || null]))
            const rows = remote.map((file) => ({
              ...normalizeRemoteFile(file, userId),
              project_id: projectByProviderId.get(String(file.id)) || null,
            }))
            for (let i = 0; i < rows.length; i += 500) {
              const chunk = rows.slice(i, i + 500)
              const { error } = await userClient.from('jarvis_files').upsert(chunk, { onConflict: 'user_id,provider,provider_file_id' })
              if (error) throw error
            }

            const seen = new Set(rows.map((row) => row.provider_file_id))
            const staleIds = (existing || []).filter((row) => !seen.has(row.provider_file_id)).map((row) => row.id)
          """.replace('            ', '')
          if s.count(old) != 1:
              raise SystemExit(f'sync source pattern count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('app.js')
          s = p.read_text()
          replacements = {
            'Tarefas e notas serão preservadas sem vínculo com ele.': 'Tarefas, notas e arquivos serão preservados sem vínculo com ele.',
            'Projeto excluído; tarefas e notas foram preservadas.': 'Projeto excluído; tarefas, notas e arquivos foram preservados.',
            'Tarefas e notas continuam sendo registros próprios e apenas se relacionam ao projeto.': 'Tarefas, notas e arquivos continuam sendo registros próprios e apenas se relacionam ao projeto.',
            'conectar agenda, finanças, projetos e, em breve, WhatsApp, Drive e lugares.': 'conectar agenda, finanças, projetos e arquivos e, em breve, WhatsApp e lugares.',
            "$('jarvisRefresh')?.addEventListener('click', () => loadJarvisData(true))": "$('jarvisRefresh')?.addEventListener('click', () => Promise.all([loadJarvisData(true), loadFilesData(true)]))",
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'app copy pattern count={s.count(old)}: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate hardened branch
        shell: bash
        run: |
          node --check app.js
          node --check jarvis-files-client.js
          node --check files-ui.js
          node --check supabase/functions/jarvis-drive/index.ts
          node tests/domain-ui.test.mjs
          node tests/v340b-attention.test.mjs
          node tests/files-ui.test.mjs
          node tests/v350-files-client.test.mjs
          node tests/v350-architecture.test.mjs
          git diff --check
      - name: Commit hardening
        shell: bash
        run: |
          rm .github/workflows/v350-sync-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v3.5.0: preserve project links during Drive sync'
          git push origin v3.5.0-drive-files
