name: v3.6.1 CI

on:
  push:
    branches:
      - v3.6.1-drive-scope
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check attention-rules.js
          node --check domain-ui.js
          node --check files-ui.js
          node --check jarvis-domain-client.js
          node --check jarvis-files-client.js
          node --check document-intelligence-core.js
          node --check document-intelligence.js
          node --check supabase/functions/jarvis-drive/scope-core.js
          node --check supabase/functions/jarvis-document-processing/scope-core.js
      - name: Edge Function type check
        run: |
          deno check supabase/functions/jarvis-drive/index.ts
          deno check supabase/functions/jarvis-document-processing/index.ts
      - name: Regression and v3.6.1 tests
        run: |
          node --test tests/domain-ui.test.mjs tests/files-ui.test.mjs tests/v340b-attention.test.mjs tests/v350-files-client.test.mjs tests/v360-architecture.test.mjs tests/v360-document-intelligence.test.mjs tests/v361-drive-scope.test.mjs
      - name: Scope guardrails
        run: |
          grep -q 'styles.css?v=3.6.1' index.html
          grep -q 'app.js?v=3.6.1' index.html
          grep -q 'document-intelligence.js?v=3.6.1' index.html
          grep -q 'drive_root_folder_id' supabase/functions/jarvis-drive/index.ts
          grep -q "in parents and trashed = false" supabase/functions/jarvis-drive/scope-core.js
          ! grep -R 'sharedWithMe' supabase/functions/jarvis-drive
          ! grep -R 'auth/drive.readonly' supabase/functions/jarvis-drive supabase/functions/jarvis-document-processing document-intelligence.js
