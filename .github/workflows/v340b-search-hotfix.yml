name: v3.4.0b search hotfix

on:
  push:
    branches: [v3.4.0b-operational-modules]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v340b-hotfix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.4.0b-operational-modules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/v340b_search_hotfix.py
      - run: |
          node --check app.js
          node --experimental-default-type=module tests/domain-ui.test.mjs
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[v340b-patched][v340b-hotfix] estabilizar busca dos módulos'
            git push origin HEAD:v3.4.0b-operational-modules
          fi
