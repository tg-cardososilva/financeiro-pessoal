name: v3.4.0b temporary patch

on:
  push:
    branches: [v3.4.0b-operational-modules]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[v340b-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.4.0b-operational-modules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply controlled patch
        run: |
          python scripts/v340b_patch.py
          sed -i 's/attention-rules.js?v=3.3.1/attention-rules.js?v=3.4.0b/' app.js
      - name: Validate syntax and pure helpers
        run: |
          node --check app.js
          node --check domain-ui.js
          node --check jarvis-domain-client.js
          node --experimental-default-type=module tests/domain-ui.test.mjs
          git diff --check
      - name: Audit canonical domain access
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('app.js').read_text()
          for token in ['remind_at','project_type','project_name','objective','priority || 3']:
              assert token not in app, token
          for table in ['jarvis_tasks','jarvis_notes','jarvis_projects']:
              assert f"from('{table}')" not in app
              assert f'from("{table}")' not in app
          load=re.search(r'async function loadJarvisData\(force = false\) \{.*?\n\}\n\nasync function loadCalendarData',app,re.S).group(0)
          for token in ['domainCreate(','domainUpdate(','domainDelete(','domainTransition(']:
              assert token not in load, token
          assert "domainList(supabase, 'task')" in load
          assert "domainList(supabase, 'note')" in load
          assert "domainList(supabase, 'project')" in load
          assert "x.status === 'pending'" not in app
          print('canonical/read-only audit: ok')
          PY
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[v340b-patched] implementar módulos operacionais'
            git push origin HEAD:v3.4.0b-operational-modules
          fi
