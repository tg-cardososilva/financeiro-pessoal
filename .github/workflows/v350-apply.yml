name: Apply v3.5.0 Drive frontend

on:
  push:
    branches: [v3.5.0-drive-files]
    paths: ['.github/workflows/v350-apply.yml']

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.5.0-drive-files
          fetch-depth: 0
      - name: Apply controlled patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/v350_patch.py
          python3 /tmp/v350_patch.py
      - name: Validate syntax and tests
        shell: bash
        run: |
          node --check app.js
          node --check jarvis-files-client.js
          node --check files-ui.js
          node tests/domain-ui.test.mjs
          node tests/v340b-attention.test.mjs
          node tests/files-ui.test.mjs
          node tests/v350-files-client.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          app = Path('app.js').read_text()
          client = Path('jarvis-files-client.js').read_text()
          html = Path('index.html').read_text()
          assert "supabase.from('jarvis_files')" not in app
          assert 'fileSync(supabase)' in app
          load = app[app.index('async function loadFilesData'):app.index('function fileProjectName')]
          assert 'fileSync(' not in load
          assert 'v=3.5.0' in html and 'data-view="files"' in html
          front = app + client + Path('files-ui.js').read_text() + html
          assert 'GOOGLE_CLIENT_SECRET' not in front
          assert 'SUPABASE_SERVICE_ROLE_KEY' not in front
          assert 'refresh_token' not in front
          print('v3.5.0 architecture assertions passed')
          PY
          git diff --check
      - name: Commit validated patch
        shell: bash
        run: |
          rm .github/workflows/v350-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v3.5.0: Drive, Arquivos e memória documental'
          git push origin v3.5.0-drive-files
