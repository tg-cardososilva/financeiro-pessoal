name: v3.4.0b finalize

on:
  push:
    branches: [v3.4.0b-operational-modules]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.4.0b-operational-modules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize version files
        run: python scripts/v340b_finalize.py
      - name: Validate final branch
        run: |
          node --check app.js
          node --check domain-ui.js
          node --check jarvis-domain-client.js
          node --experimental-default-type=module tests/domain-ui.test.mjs
          node --experimental-default-type=module tests/v340b-attention.test.mjs
          grep -q 'styles.css?v=3.4.0b' index.html
          grep -q 'app.js?v=3.4.0b' index.html
          grep -q '## v3.4.0b' README.md
          git diff --check
      - name: Remove temporary finalizer and commit
        run: |
          rm -f scripts/v340b_finalize.py .github/workflows/v340b-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v3.4.0b: finalizar módulos operacionais e cache-bust'
          git push origin HEAD:v3.4.0b-operational-modules
