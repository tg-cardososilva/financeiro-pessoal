name: Temporary apply v3.2.2 patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v322-temporary.yml

permissions:
  contents: write

jobs:
  patch-v322:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.2.2-clean-frontend
      - name: Apply guarded patch
        run: python3 scripts/v322_patch.py
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate diff whitespace
        run: git diff --check
      - name: Verify temporary Jarvis cleanup is gone
        run: |
          ! grep -q "JARVIS_TEST_CLEANUP_KEY" app.js
          ! grep -q "isJarvisTest" app.js
          ! grep -q "cleanupKnownJarvisTestData" app.js
          grep -q "function dedupeJarvisActions" app.js
          grep -q "function dedupeJarvisAnnotations" app.js
      - name: Verify loadJarvisData is read-only
        run: python3 - <<'PY'
          from pathlib import Path
          s = Path('app.js').read_text(encoding='utf-8')
          a = s.index('async function loadJarvisData(force = false) {')
          b = s.index('function jarvisIntentLabel(intent) {', a)
          block = s[a:b]
          forbidden = ['.delete()', '.insert(', '.update(', '.upsert(', '.rpc(', '.functions.invoke(']
          found = [x for x in forbidden if x in block]
          if found:
              raise SystemExit('loadJarvisData writes data: ' + ', '.join(found))
          print('loadJarvisData is read-only')
          PY
      - name: Commit validated patch to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html README.md
          git commit -m "fix: make Jarvis screen loading read-only in v3.2.2"
          git push origin HEAD:v3.2.2-clean-frontend
