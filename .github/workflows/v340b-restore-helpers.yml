name: v3.4.0b restore shared helpers

on:
  push:
    branches: [v3.4.0b-operational-modules]

permissions:
  contents: write

jobs:
  restore-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.4.0b-operational-modules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore baseline helpers
        run: python scripts/v340b_restore_shared_helpers.py
      - name: Validate full frontend contract
        run: |
          node --check app.js
          node --check domain-ui.js
          node --check jarvis-domain-client.js
          node --experimental-default-type=module tests/domain-ui.test.mjs
          node --experimental-default-type=module tests/v340b-attention.test.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('app.js').read_text()
          required=[
            'function jarvisIntentLabel(', 'function jarvisGoogleConnection(', 'function formatJarvisEvent(',
            'async function connectJarvisGoogleCalendar(', 'async function executeJarvisCalendarAction(',
            'async function testJarvisWhatsApp(', 'function jarvisDateTime(', 'function personalLoading(',
            'function bindPersonalNav(', 'function jarvisPresenceMarkup(', 'function setJarvisVisualState(',
            'function shouldUseCalendarRead(', 'async function invokeJarvisEngine(', 'async function sendJarvisQuick(',
            'function zonedDateKey(', 'function groupCalendarEvents('
          ]
          for item in required: assert item in app, item
          for token in ['remind_at','project_type','project_name','objective','priority || 3']:
              assert token not in app, token
          for table in ['jarvis_tasks','jarvis_notes','jarvis_projects']:
              assert f"from('{table}')" not in app
              assert f'from("{table}")' not in app
          load=re.search(r'async function loadJarvisData\(force = false\) \{.*?\n\}',app,re.S).group(0)
          for write in ['domainCreate(','domainUpdate(','domainDelete(','domainTransition(']: assert write not in load
          print('shared helper + read-only audit: ok')
          PY
          git diff --check
      - name: Commit clean repair
        run: |
          rm -f scripts/v340b_restore_shared_helpers.py .github/workflows/v340b-restore-helpers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restaurar helpers compartilhados preservando contrato v3.4.0b'
          git push origin HEAD:v3.4.0b-operational-modules
