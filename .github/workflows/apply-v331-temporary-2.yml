name: Temporary apply v3.3.1 attention patch retry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v331-temporary-2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.3.1-requer-atencao
      - name: Apply guarded patch
        run: python3 scripts/v331_patch.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          cp attention-rules.js /tmp/attention-rules.mjs
          node --check /tmp/attention-rules.mjs
      - name: Test attention rules with in-memory fixtures only
        run: |
          cp attention-rules.js /tmp/attention-rules.mjs
          node --input-type=module <<'NODE'
          import { buildAttentionItems, attentionSummary } from 'file:///tmp/attention-rules.mjs'
          const now = new Date('2026-09-05T15:00:00-03:00')
          const items = buildAttentionItems({
            now,
            tasks: [
              { id:'t1', status:'pending', title:'Tarefa vencida', due_at:'2026-09-05T12:00:00-03:00' },
              { id:'t1', status:'pending', title:'Tarefa vencida', due_at:'2026-09-05T12:00:00-03:00' }
            ],
            actions: [{ id:'a1', status:'proposed', action_type:'calendar_create', payload:{ title:'Reunião', starts_at:'2026-09-05T18:00:00-03:00' } }],
            reviewTransactions: [
              { id:'x1', review_status:'needs_review', transaction_date:'2026-09-01' },
              { id:'x2', review_status:'needs_review', transaction_date:'2026-09-02' }
            ],
            annotations: [
              { id:'n1', reconciliation_status:'pending', occurred_at:'2026-09-01T10:00:00-03:00' },
              { id:'n2', reconciliation_status:'pending', occurred_at:'2026-09-04T10:00:00-03:00' }
            ],
            calendarEvents: [{ id:'e1', title:'Dentista', start:'2026-09-05T16:00:00-03:00', end:'2026-09-05T17:00:00-03:00' }],
            connections: [{ id:'c1', provider:'google_calendar', status:'connected' }]
          })
          if (items.filter(x => x.key === 'task:t1').length !== 1) throw new Error('task dedupe failed')
          if (items.filter(x => x.key === 'transactions:needs_review').length !== 1) throw new Error('transaction consolidation failed')
          if (items.filter(x => x.key === 'annotations:pending').length !== 1) throw new Error('annotation consolidation failed')
          if (items[0]?.urgency !== 'critical') throw new Error('urgency ordering failed')
          if (!attentionSummary(items).includes('urgente')) throw new Error('summary failed')
          const integrations = buildAttentionItems({ now, connections:[{provider:'google_calendar',status:'failed'}], calendarError:'timeout' })
          if (integrations.filter(x => x.key === 'integration:google_calendar').length !== 1) throw new Error('integration dedupe failed')
          if (buildAttentionItems({ now }).length !== 0) throw new Error('empty state should stay empty')
          console.log('attention rules validated with ephemeral fixtures')
          NODE
      - name: Validate read-only Home paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.js').read_text(encoding='utf-8')
          for start_marker,end_marker,label in [
            ('async function loadAttentionData(force = false) {','function updateUserChrome() {','attention loader'),
            ('function renderHome() {','function renderAgenda() {','home render')
          ]:
            start=text.index(start_marker); end=text.index(end_marker,start); block=text[start:end]
            forbidden=['.delete()', '.insert(', '.update(', '.upsert(', '.rpc(']
            bad=[x for x in forbidden if x in block]
            if bad: raise SystemExit(f'{label} contains writes: {bad}')
          if ".eq('review_status', 'needs_review')" not in text:
            raise SystemExit('global review query missing')
          if 'buildAttentionItems({' not in text:
            raise SystemExit('attention rules engine not wired')
          print('Home and attention loaders are read-only')
          PY
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit v3.3.1 branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js attention-rules.js index.html styles.css README.md
          git commit -m "feat: derive Home attention from real data in v3.3.1"
          git push origin HEAD:v3.3.1-requer-atencao
