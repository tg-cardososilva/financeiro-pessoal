name: Apply v3.2.2 guarded cleanup

on:
  push:
    branches:
      - v3.2.2-clean-frontend
    paths:
      - scripts/v322_patch.py
      - .github/workflows/v322-patch.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.2.2-clean-frontend
      - name: Apply guarded patch
        run: python3 scripts/v322_patch.py
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate diff whitespace
        run: git diff --check
      - name: Show focused diff
        run: git diff -- app.js index.html README.md
      - name: Commit v3.2.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html README.md
          git commit -m "fix: make Jarvis screen loading read-only in v3.2.2"
          git push origin HEAD:v3.2.2-clean-frontend
