name: Temporary harden v3.3.0 calendar dates

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v330-temporary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.3.0-agenda-real
      - name: Make calendar date rendering timezone-stable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          text=p.read_text()
          old="    return new Date(y, m - 1, d, 12)\n"
          new="    return new Date(Date.UTC(y, m - 1, d, 12))\n"
          if text.count(old) != 1:
              raise SystemExit(f'all-day date target count={text.count(old)}')
          text=text.replace(old,new,1)
          marker="""function calendarEventDateLabel(event) {\n  const date = calendarEventStartDate(event)\n  if (!date) return '--'\n  return new Intl.DateTimeFormat('pt-BR', { timeZone: JARVIS_TIMEZONE, day: '2-digit', month: 'short' }).format(date)\n}\n"""
          addition=marker+"""\nfunction calendarEventDayLabel(event) {\n  const date = calendarEventStartDate(event)\n  if (!date) return '--'\n  return new Intl.DateTimeFormat('pt-BR', { timeZone: JARVIS_TIMEZONE, day: '2-digit' }).format(date)\n}\n\nfunction calendarEventMonthLabel(event) {\n  const date = calendarEventStartDate(event)\n  if (!date) return ''\n  return new Intl.DateTimeFormat('pt-BR', { timeZone: JARVIS_TIMEZONE, month: 'short' }).format(date)\n}\n"""
          if text.count(marker) != 1:
              raise SystemExit(f'date helper marker count={text.count(marker)}')
          text=text.replace(marker,addition,1)
          old_template="${esc(calendarEventDateLabel(event).split(' ')[0] || '--')}</strong><span>${esc(calendarEventDateLabel(event).split(' ')[1] || '')}"
          new_template="${esc(calendarEventDayLabel(event))}</strong><span>${esc(calendarEventMonthLabel(event))}"
          if text.count(old_template) != 1:
              raise SystemExit(f'agenda date template target count={text.count(old_template)}')
          text=text.replace(old_template,new_template,1)
          p.write_text(text)
          PY
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate diff whitespace
        run: git diff --check
      - name: Verify calendar date helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.js').read_text()
          assert 'calendarEventDayLabel' in text
          assert 'calendarEventMonthLabel' in text
          assert "new Date(Date.UTC(y, m - 1, d, 12))" in text
          assert ".split(' ')[0]" not in text[text.index('function renderAgenda()'):text.index('function renderTasks()')]
          print('calendar date rendering validated')
          PY
      - name: Commit date fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: make calendar dates timezone-stable"
          git push origin HEAD:v3.3.0-agenda-real
