name: Temporary harden v3.3.0 calendar routing

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v330-temporary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.3.0-agenda-real
      - name: Preserve explicit agenda commands as writes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          text=p.read_text()
          old="  const writeIntent = /\\b(agende|agendar|marque|marcar|crie|criar|adicione|adicionar|cancele|cancelar|remarque|remarcar|mude|mudar|altere|alterar|apague|apagar|remova|remover)\\b/.test(text)\n"
          new="  const writeIntent = /\\b(agende|agendar|marque|marcar|crie|criar|adicione|adicionar|cancele|cancelar|remarque|remarcar|mude|mudar|altere|alterar|apague|apagar|remova|remover)\\b/.test(text)\n    || /^(jarvis[,:]?\\s+)?agenda\\s+(uma|um|a|o|reuniao|evento|consulta|compromisso)\\b/.test(text)\n"
          if text.count(old) != 1:
              raise SystemExit(f'write router target count={text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate diff whitespace
        run: git diff --check
      - name: Verify routing and read-only loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.js').read_text()
          assert "agenda\\s+(uma|um|a|o|reuniao|evento|consulta|compromisso)" in text
          start=text.index('async function loadCalendarData(force = false) {')
          end=text.index('function calendarSourceLabel', start)
          block=text[start:end]
          assert not any(x in block for x in ['.delete()', '.insert(', '.update(', '.upsert(', '.rpc('])
          assert "supabase.functions.invoke('jarvis-calendar-read'" in block
          print('routing and read-only loader validated')
          PY
      - name: Commit routing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: keep explicit agenda commands on confirmation flow"
          git push origin HEAD:v3.3.0-agenda-real
