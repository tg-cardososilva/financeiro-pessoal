name: Temporary apply v3.3.0 patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v330-temporary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.3.0-agenda-real
      - name: Apply guarded patch
        run: python3 scripts/v330_patch.py
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate diff whitespace
        run: git diff --check
      - name: Verify read-only calendar loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.js').read_text()
          start=text.index('async function loadCalendarData(force = false) {')
          end=text.index('function calendarSourceLabel', start)
          block=text[start:end]
          forbidden=['.delete()', '.insert(', '.update(', '.upsert(', '.rpc(']
          assert not any(x in block for x in forbidden), block
          assert "supabase.functions.invoke('jarvis-calendar-read'" in block
          assert 'scheduledCalendarActions' not in text
          assert 'Jarvis · aguardando confirmação' in text
          print('calendar read path validated')
          PY
      - name: Commit v3.3.0 branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css README.md
          git commit -m "feat: add real Google Calendar agenda to Home v3.3.0"
          git push origin HEAD:v3.3.0-agenda-real
