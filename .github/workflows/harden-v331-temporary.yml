name: Temporary harden v3.3.1 attention

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/harden-v331-temporary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.3.1-requer-atencao
      - name: Harden ownership and cache invalidation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          text=p.read_text(encoding='utf-8')
          old="""async function loadData() {
            if (!state.session || state.loading) return
            state.loading = true
            showError('')
          """
          new="""async function loadData() {
            if (!state.session || state.loading) return
            state.loading = true
            state.attention.loaded = false
            showError('')
          """
          if text.count(old) != 1:
              raise SystemExit(f'loadData target count={text.count(old)}')
          text=text.replace(old,new,1)
          oldq="""      .select('id,transaction_date,display_description,description,merchant,amount,review_status,created_at')
                .eq('review_status', 'needs_review')
          """
          newq="""      .select('id,transaction_date,display_description,description,merchant,amount,review_status,created_at')
                .eq('user_id', state.session.user.id)
                .eq('review_status', 'needs_review')
          """
          if text.count(oldq) != 1:
              raise SystemExit(f'attention query target count={text.count(oldq)}')
          text=text.replace(oldq,newq,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.js').read_text(encoding='utf-8')
          assert "state.attention.loaded = false" in text[text.index('async function loadData() {'):text.index('function updateUserChrome() {')]
          start=text.index('async function loadAttentionData(force = false) {')
          end=text.index('function updateUserChrome() {',start)
          block=text[start:end]
          assert ".eq('user_id', state.session.user.id)" in block
          assert not any(x in block for x in ['.delete()', '.insert(', '.update(', '.upsert(', '.rpc('])
          print('attention ownership and cache invalidation validated')
          PY
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: keep attention review data fresh and user-scoped"
          git push origin HEAD:v3.3.1-requer-atencao
